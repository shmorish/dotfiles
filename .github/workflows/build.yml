name: Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    # aarch64-darwin 向け設定なので Apple Silicon ランナーで評価する
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - uses: DeterminateSystems/nix-installer-action@main

    - name: Check flake
      run: nix flake check --no-build

    # wezterm はソースビルドになるので CI では評価とキャッシュ照会のみ (--dry-run)
    - name: Evaluate Home Manager configuration
      run: nix build .#homeConfigurations.sh-morishita.activationPackage --dry-run
